http:
  addr: ":7680"
  timeout_ms: 60000
  retries: 5
  backoff:
    min_exp: 10
    max_exp: 13
  provider_timeout_ms: 10000
version: "0.0.5"
session:
  ttl_ms: 86400000
  ttl_max_ms: 86400000
scan:
  sample_videos: 5
match:
  min_score: 0.72
  solo_min_score: 0.01
  min_margin: 0.04
  min_hits: 1
  workers: 8
  cooldown_fails: 5
  cooldown:
    min_exp: 16
    max_exp: 19
  prefer:
    anime:
      language: Japanese
      kind: Animation
  plot_stop: [a, an, the, of, to, in, on, at, is, and, or, my, i, this, that, for, with, from, as, by]
  wait_cap: 500
  synopsis_limit: 4000
group:
  seq_threshold: 0.72
  video_ext: [mkv, mp4, avi, m4v, ts, m2ts]
  extras:
    - behind the scenes
    - deleted scenes
    - trailers
    - interviews
    - scenes
    - featurettes
    - shorts
    - other
    - extra
    - extras
    - openings
    - endings
    - openings & endings
    - nc
    - ncop
    - nced
  release:
    - 1080p
    - 720p
    - 480p
    - 2160p
    - 4k
    - bluray
    - blu-ray
    - web-dl
    - webrip
    - web
    - hdtv
    - x264
    - x265
    - h264
    - h265
    - hevc
    - avc
    - av1
    - aac
    - ac3
    - dts
    - opus
    - hdr
    - hdr10
    - dv
    - remux
    - proper
    - repack
    - internal
    - multi
    - dual
    - audio
    - subs
    - subbed
    - dubbed
    - uncensored
    - 10bit
    - 10-bit
    - 8bit
    - bd
    - nf
    - amzn
    - dsnp
    - hmax
    - cr
    - bili
  kinds: [ova, ovas, oad, oads, special, specials, movie, movies, film]
ingest:
  sample_rows: 3
  aliases:
    mediatype: type
    seasonnumber: season
    episodenumber: episode
    imdbid: imdb
  types:
    tv: tv
    anime: anime
    movie: movie
    series: tv
    episode: tv
    season: tv
    film: movie
providers:
  tvmaze:
    types: [tv, anime, ""]
    min_interval_ms: 600
    retries: 2
    base: "https://api.tvmaze.com"
    url: "{base}/search/shows"
    query: { q: "{title}" }
    items: "$"
    fields: { id: show.id, title: show.name, year: show.premiered, url: show.url, synopsis: show.summary, poster: show.image.medium, kind: show.type, language: show.language }
    year: prefix4
    titles:
      url: "{base}/shows/{id}/akas"
      items: "$"
      fields: { title: name }
      max: 3
    episode:
      url: "{base}/shows/{id}/episodebynumber"
      query: { season: "{season}", number: "{episode}" }
      fields: { id: id, title: name, year: airdate, url: url }
      year: prefix4
    catalog:
      seasons:
        url: "{base}/shows/{id}/seasons"
        items: "$"
        fields: { id: id, number: number, title: name, synopsis: summary, poster: image.medium, year: premiereDate }
        year: prefix4
      episodes:
        url: "{base}/shows/{id}/episodes"
        items: "$"
        fields: { id: id, number: number, title: name, synopsis: summary, poster: image.medium, season: season, year: airdate }
        year: prefix4
    nfo: tvshow
  jikan:
    types: [anime]
    base: "https://api.jikan.moe/v4"
    url: "{base}/anime"
    query: { q: "{title}", limit: "25", sfw: "false", order_by: "popularity", sort: "asc" }
    items: data
    fields: { id: mal_id, title: title, year: aired.from, url: url, synopsis: synopsis, poster: images.jpg.image_url, title_en: title_english, title_jp: title_japanese }
    attrs: { language: Japanese, kind: Animation }
    year: prefix4
    min_interval_ms: 1100
    retries: 1
    provider_timeout_ms: 4000
    defer: true
  omdb:
    types: [movie]
    require: api_key
    base: "https://www.omdbapi.com"
    url: "{base}"
    query: { apikey: "{api_key}", s: "{title}", type: "movie" }
    items: Search
    fields: { id: imdbID, title: Title, year: Year, url: imdbID, poster: Poster }
    url_prefix: "https://www.imdb.com/title/"
    nfo: movie
    uniqueid: imdb
    detail:
      url: "{base}"
      query: { apikey: "{api_key}", i: "{id}", plot: "short" }
      fields: { synopsis: Plot }
  tmdb:
    types: [movie, anime]
    require: api_key
    defer: true
    base: "https://api.themoviedb.org/3"
    url: "{base}/search/movie"
    query: { api_key: "{api_key}", query: "{title}", include_adult: "false" }
    items: results
    fields: { id: id, title: title, year: release_date, url: id, synopsis: overview, poster: poster_path }
    year: prefix4
    url_prefix: "https://www.themoviedb.org/movie/"
    poster_prefix: "https://image.tmdb.org/t/p/w185"
    nfo: movie
    uniqueid: tmdb-movie
  tmdb_tv:
    types: [tv, anime]
    require: api_key
    secret: tmdb
    defer: true
    nfo: tvshow
    uniqueid: tmdb-tv
    base: "https://api.themoviedb.org/3"
    url: "{base}/search/tv"
    query: { api_key: "{api_key}", query: "{title}", include_adult: "false" }
    items: results
    fields: { id: id, title: name, year: first_air_date, url: id, synopsis: overview, poster: poster_path }
    year: prefix4
    url_prefix: "https://www.themoviedb.org/tv/"
    poster_prefix: "https://image.tmdb.org/t/p/w185"
    catalog:
      seasons:
        url: "{base}/tv/{id}"
        query: { api_key: "{api_key}" }
        items: seasons
        fields: { id: id, number: season_number, title: name, synopsis: overview, poster: poster_path }
        poster_prefix: "https://image.tmdb.org/t/p/w185"
      episodes:
        url: "{base}/tv/{id}/season/{season}"
        query: { api_key: "{api_key}" }
        items: episodes
        fields: { id: id, number: episode_number, title: name, synopsis: overview, poster: still_path }
        poster_prefix: "https://image.tmdb.org/t/p/w185"
