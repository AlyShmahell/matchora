services:
  stub:
    build:
      context: ./stub
      dockerfile: Containerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/search/shows?q=girls"]
      interval: 2s
      timeout: 2s
      retries: 10

  matchora:
    build:
      context: ./runner
      dockerfile: Containerfile
    volumes:
      - ../build/dist:/opt/matchora:z
      - matchora-vendor:/opt/matchora/vendor:z
      - ./fixtures/library:/opt/matchora/data/library:z
      - ./config.yaml:/run/matchora/config.yaml:z
    tmpfs:
      - /opt/matchora/data
    depends_on:
      stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7680/health"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 300s

  check:
    build:
      context: ./runner
      dockerfile: Containerfile
    volumes:
      - ../build/dist:/opt/matchora:z
      - ./image/run:/check:z
    entrypoint: ["/bin/sh", "/check"]

  unit:
    image: docker.io/library/golang:1.26-bookworm
    volumes:
      - ../matchora:/src:z
    working_dir: /src
    command: ["go", "test", "-buildvcs=false", "./lib/llama", "./lib/match", "./lib/scan", "./lib/config", "./lib/jobs", "./lib/ingest", "./lib/library"]

  tester:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      matchora:
        condition: service_healthy
    command: ["/smoke/run"]

  matchora-live:
    profiles: ["live"]
    build:
      context: ./runner
      dockerfile: Containerfile
    volumes:
      - ../build/dist:/opt/matchora:z
      - matchora-vendor:/opt/matchora/vendor:z
    tmpfs:
      - /opt/matchora/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7680/health"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 300s

  live:
    profiles: ["live"]
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      matchora-live:
        condition: service_healthy
    command: ["/live/run"]

volumes:
  matchora-vendor:
