# Pull-only toolchain images. No application services.
# Usage: podman compose -f toolchains/compose.yaml --profile pull pull
services:
  go-bookworm:
    image: docker.io/library/golang:1.26-bookworm
    profiles: ["pull"]
    command: ["true"]
  go-alpine:
    image: docker.io/library/golang:1.26-alpine
    profiles: ["pull"]
    command: ["true"]
  alpine:
    image: docker.io/library/alpine:3.24
    profiles: ["pull"]
    command: ["true"]
